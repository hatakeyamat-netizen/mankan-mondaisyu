["マンションの住戸部分の賃貸借契約において、契約期間を定めなかった場合には、その契約は、期間1年の賃貸借契約とみなされる。","×","期間を定めなかった場合は「期間の定めのない」賃貸借となります。期間1年とみなされるわけではありません。前問「1年未満は期間の定めのないものとみなす」（29条1項）との違いに注意です。","名称未設定問8"],
["賃借人は、建物賃貸借についての登記がなくても、貸主から引渡しを受けた場合には、その後に当該建物を賃貸人から買い受けた第三者に対して、建物賃借権を対抗することができる。","○","建物の引渡しがあれば、その後の第三者に対して賃借権を対抗できます（借地借家法31条）。不動産賃借権の対抗要件として登記が原則ですが、建物賃貸借では引渡しでも対抗できる点がポイントです。","名称未設定問9"],
["定期建物賃貸借契約を締結する場合には、必ず公正証書によってしなければならない。","×","公正証書等の書面（公正証書に限られない）によって締結すればよく、必ずしも公正証書である必要はありません（38条1項）。","名称未設定問10"],
["定期建物賃貸借契約の期間を3年と定めた場合、賃貸人が期間満了の1年前から6ヵ月前までの間に契約が終了する旨を賃借人に通知しなかったときは、期間満了により、従前の契約と同一の条件で更新される。","×","定期建物賃貸借契約は更新されません。通知期間内に通知をしなかった場合でも、その後に通知をした日から6ヵ月を経過することにより、賃貸人は賃借人に対して終了を対抗することができます（38条6項）。「従前の契約と同一の条件で更新される」という結論が誤りです。","名称未設定問11"],
["定期建物賃貸借契約においては、賃借人からの賃料の減額請求をすることができない旨の特約は、有効である。","○","定期建物賃貸借では、借賃の増減請求権の規定を適用しない旨の特約が有効です（38条9項）。よって減額請求できない旨の特約も有効です。","名称未設定問12"],
["賃貸住宅管理業を営もうとする者は、国土交通大臣の免許を受けなければならない。","×","「免許」ではなく「登録」を受けなければなりません（賃貸住宅管理業法3条1項）。なお、賃貸住宅管理業に係る戸数が200戸未満であるときは、登録を受ける必要はありません（施行規則3条）。","名称未設定問13"],
["賃貸住宅管理業者は、その営業所又は事務所ごとに、業務に従事する者5人に1人以上の割合の業務管理者を選任しなければならない。","○","業務管理者は、営業所又は事務所ごとに、業務に従事する者5人に1人以上の割合で選任します（12条1項）。","名称未設定問15"],
["賃貸住宅管理業者は、管理受託契約を締結しようとするときは、原則として、管理業務を委託しようとする賃貸住宅の賃貸人に、当該管理受託契約を締結するまでに、管理受託契約の内容及びその履行に関する事項であって一定のものについて、業務管理者をして書面を交付して説明させなければならない。","×","説明義務はありますが、「業務管理者をして」説明させることは要求されていません（13条1項）。","名称未設定問16"],
["特定転貸事業者が、特定賃貸借契約を締結しようとするときは、必ず、特定賃貸借契約の相手方となろうとする者に対し、当該特定賃貸借契約の内容及びその履行に関する事項で一定のものについて、書面を交付して説明しなければならない。","×","特定の専門的知識及び経験を有すると認められる者として国土交通省令で定める者に対しては、書面を交付して説明する必要はありません（30条1項）。「必ず」ではなく例外があります。","名称未設定問17"],
["新築住宅とは、新たに建設された住宅で、かつ、まだ人の居住の用に供したことのないもので、当該住宅を買主に引き渡した時から1年を経過していないものをいう。","×","「買主に引き渡した時」ではなく「建設工事の完了の日」から起算して1年を経過していないものをいいます（品確法2条2項）。起算点の違いがポイントです。","名称未設定問18"],
["新築住宅について、住宅新築請負契約に基づき請負人が注文者に引き渡した時から10年間瑕疵を担保する責任を負う部位は、同住宅の構造耐力上主要な部分又は雨水の浸入を防止する部分として政令で定めるものである。","○","10年間の瑕疵担保責任（新築住宅の構造耐力上主要な部分及び雨水侵入防止部分に関するもの）です。","名称未設定問19"],
["住宅性能評価の制度は、新築住宅だけでなく、既存住宅も対象とする。","○","住宅性能評価制度は新築住宅・既存住宅の両方が対象です（品確法5条参照）。","名称未設定問20"]
]},
{t:"第3章　標準管理規約①",s:"専有部分・共用部分の範囲／敷地等の共有／用法（両試験で毎年出題）",q:[
["各住戸の玄関扉については、錠及び内部塗装部分が専有部分である。","○","玄関扉のうち専有部分となるのは錠と内部塗装部分だけで、扉自体は共用部分です（7条2項2号）。","講義⑤P210"],
["窓枠及び窓ガラスは、専有部分である。","×","窓枠・窓ガラスは専有部分に含まれず、共用部分です（7条2項3号）。","講義⑤P210"],
["雨戸及び網戸は、いずれも共用部分である。","○","雨戸・網戸も窓枠等と同様に共用部分として扱われます（7条関係コメント）。","講義⑤P210"],
["各住戸のメーターボックス自体は法定共用部分であるが、その内部にある給湯器ボイラーについては専有部分である。","○","メーターボックス自体（箱）は共用部分ですが、内部の給湯器ボイラーのような設備は専有部分です。混同しやすい論点です。","答練解説問16（弱点補強）"],
["給水管については、本管から各住戸メーターを含む部分が法定共用部分である。","○","各住戸メーターまでが共用部分、そこから先の枝管は専有部分です。","答練解説問16（弱点補強）"],
["玄関扉において、錠及び内部塗装部分は法定共用部分に含まれる。","×","玄関扉のうち錠・内部塗装部分は専有部分に含まれます。扉自体（外部塗装部分等）が共用部分です。","答練解説問16（弱点補強）"],
["メーターボックスは共用部分であるが、その内部にある給湯器ボイラー等の設備は専有部分である。","○","メーターボックス自体と内部の設備を区別して押さえる必要があります（別表第2）。","講義⑤P212"],
["給水管については、本管から各住戸メーターを含む部分が共用部分である。","○","各住戸メーターまでが共用部分で、そこから先の枝管が専有部分です（別表第2）。","講義⑤P212"],
["雑排水管及び汚水管については、配管継手及び立て管が共用部分である。","○","配管継手と立て管が共用部分で、専有部分内の排水枝管は専有部分です（別表第2）。","講義④P212／⑤P212"],
["共用部分の共有持分の割合の基準となる面積は、内法計算による。","×","壁心計算（界壁の中心線で囲まれた部分の面積を算出する方法）によります（10条関係コメント①）。","講義⑤P217"],
["壁心計算は専有部分の範囲を定めるための方法であり、専有部分の範囲は界壁の中心線までとなる。","×","壁心計算は面積の測り方であって、範囲を定めるものではありません。専有部分の範囲は上塗り部分までとする上塗り説が採用されています。","講義④P217"],
["敷地及び附属施設の共有持分は、規約によって定まる。","×","敷地及び附属施設の共有持分は分譲契約等によって定まります。規約で定まるのは共用部分の共有持分です（10条関係コメント②）。","講義⑤P217"],
["共用部分の共有持分は、規約によって定まる。","○","前問と対にして押さえます。敷地は分譲契約等、共用部分は規約です（10条関係コメント②）。","講義⑤P217"],
["駐車場使用契約により駐車場を使用する権利は専用使用権であり、区分所有者以外の占有者も使用することができる。","×","駐車場の使用は専用使用権ではなく、使用できる者は区分所有者に限定されています。占有者や第三者に使用させるには規約が必要です。","講義④P222"],
["区分所有者が専有部分を第三者に譲渡又は貸与したときは、その区分所有者の駐車場使用契約は効力を失う。","○","譲り受けた者が駐車場の使用を希望する場合は、管理組合と新たに使用契約を締結する必要があります（15条3項）。","講義⑤P224"],
["駐車場使用細則等に、管理費等の滞納などの規約違反があった場合には駐車場使用契約を解除できる旨の規定を定めることはできない。","×","そのような規定を定めることもできます（15条関係コメント）。","講義⑤P223"],
["管理組合は、理事会の決議を経て、敷地及び共用部分等（駐車場及び専用使用部分を除く）の一部について、第三者に使用させることができる。","×","理事会ではなく総会の決議が必要です（16条2項）。携帯電話基地局の屋上設置などが典型例です。","講義⑤P224／④P224"],
["宅地建物取引業者Aが自ら売主としてマンションの一住戸の売買を行う場合、宅地建物取引業法第35条の重要事項説明において、代金の額並びにその支払の時期及び方法は説明しなければならない事項である。","×","代金の額並びにその支払時期及び方法は、宅建業法37条に基づく契約内容を記載した書面（37条書面）の記載事項です。重要事項説明書（35条書面）の記載事項ではないため、説明する必要はありません。","答練解説問5（弱点補強）"],
["宅地建物取引業者Aが自ら売主としてマンションの一住戸の売買を行う場合、マンションの一住戸の区分所有者が負担すべき通常の管理費用の額は、重要事項として説明する必要はない。","×","通常の管理費用の額は重要事項として必ず説明しなければなりません。","答練解説問5（弱点補強）"],
["宅地建物取引業者Aが自ら売主としてマンションの一住戸の売買を行う場合、当該マンションの管理が委託されているときは、その委託を受けている者の商号又は名称のほか、専任の管理業務主任者の氏名も重要事項として説明しなければならない。","×","委託を受けている者の商号・名称及び住所（法人の場合は主たる事務所の所在地）は説明が必要ですが、専任の管理業務主任者の氏名については説明する必要はありません。","答練解説問5（弱点補強）"],
["宅地建物取引業者Aが自ら売主としてマンションの一住戸の売買を行う場合、宅地又は建物の引渡しの時期は、宅地建物取引業法第35条に規定する重要事項として説明しなければならない。","×","宅地又は建物の引渡しの時期は37条書面の記載事項であり、重要事項説明書（35条書面）の記載事項ではないため、説明する必要はありません。","答練解説問5（弱点補強）"],
["新築分譲マンションのアフターサービスは、売主による補修だけでなく、買主からの損害賠償請求や契約の解除も定めることが多い。","×","アフターサービスは、売主が無償で補修するという内容のサービスであり、損害賠償請求や契約解除を「定めない」ことが多い点に注意が必要です。","答練解説問8（弱点補強）"],
["アフターサービスの責任を負う期間やその期間の起算日は、対象となる部位や欠陥の種類によって異なることが多い。","○","部位・欠陥の種類ごとに期間や起算日が異なるのが一般的です。","答練解説問8（弱点補強）"],
["アフターサービスの対象範囲は、マンションの専有部分に限定し、当該マンションの共用部分を含まないとすることが多い。","×","アフターサービスの対象範囲は、専有部分に限定せず共用部分も含むことが多いです。","答練解説問8（弱点補強）"],
["アフターサービスの対象は、天災地変等の不可抗力による損壊等についても含むとすることが多い。","×","天災地変等の不可抗力による損壊等については、アフターサービスの適用除外とすることが多いです。","答練解説問8（弱点補強）"],
["個人が、マンションの賃貸業者から、1階の店舗部分を店舗用として賃借する契約には、この法が適用される。","○","消費者契約に該当し、消費者契約法が適用されます。","答練基礎答練問6"],
["適格消費者団体は、事業者に対し、不特定かつ多数の消費者の利益のため、この法の規定による差止請求権及び損害賠償請求権を行使することができる。","×","【訂正】適格消費者団体が行使できるのは差止請求権のみです。損害賠償請求権の行使は認められていません。","答練解説問6（訂正・弱点補強）"]
]},
{t:"第4章　標準管理規約②",s:"総会・理事会・役員（両試験で高頻度出題される分野）",q:[
["総会の普通決議は、出席組合員の議決権の過半数で決する。","○","区分所有法は区分所有者及び議決権の各過半数ですが、標準管理規約は出席組合員の議決権の過半数です（47条2項）。","講義⑤P278"],
["組合員の代理人となることができる者に、その組合員の住戸の賃借人は含まれない。","○","代理人となれるのは配偶者、一親等の親族、住戸に同居する親族、他の組合員、国内管理人です。賃借人は含まれません（46条5項）。","講義⑤P277"],
["組合員の一親等の親族が代理人となる場合には、その組合員の住戸に同居していることが必要である。","×","一親等の親族は同居要件が不要です。一方「住戸に同居する親族」は親等を問いません。","講義⑤P277／⑥P277"],
["理事は、管理組合に著しい損害を及ぼすおそれのある事実があることを発見したときは、直ちに、当該事実を理事会に報告しなければならない。","×","報告先は理事会ではなく監事です（40条2項）。","講義⑥P270"],
["監事は、管理組合の業務の執行及び財産の状況について不正があると認めるときは、理事会の承認を経ずに臨時総会を招集することができる。","○","監事の臨時総会招集に理事会の承認は不要です。あわせて理事会の招集を請求することもできます（41条3項）。","講義⑥P271／⑤P271"],
["理事会の会議は、理事の半数以上が出席しなければ開くことができず、その議事は出席理事の過半数で決する。","○","理事会には特別多数決議は存在しません。規約変更に関する案を決議する場合も同じ要件です（53条1項）。","講義⑤／⑥P291・293"],
["理事会の議事録については、理事長は所定の掲示場所にその保管場所を掲示しなければならない。","×","総会の議事録は保管場所の掲示が必要ですが、理事会の議事録は掲示が不要です。帳票類や長期修繕計画書等も掲示不要です。","講義⑤P291・P300"],
["総会においては、組合員が代理人により議決権を行使しようとする場合、国内管理人は、その代理人に含まれない。","×","国内管理人も代理人に含まれます（46条5項）。","答練基礎答練問19"],
["管理不全専有部分管理人は、組合員に代わって、総会において議決権を行使することができる。","○","管理不全専有部分管理人の役割です（46条5項）。","答練基礎答練問19"],
["総会の会議は、組合員総数の半数以上の組合員が出席しなければならない。","×","総会成立要件は「組合員総数の半数以上」ではなく「出席組合員の議決権」で判定します。","答練基礎答練問19"],
["バリアフリー化の工事に関し、階段室部分を改造して、エレベーターを新たに設置する工事は、組合員総数及び議決権数の各過半数を有する組合員が出席した総会における出席組合員及びその議決権の各3分の2以上で決することができる。","○","大規模修繕に該当するため、各3分の2以上の決議が必要です（47条3項）。","答練基礎答練問19"],
["理事会の職務として、理事の職務の執行の監督のほか、理事長、副理事長、会計担当理事及び監事を選任及び解任することができる。","×","理事長・副理事長・会計担当理事の選任及び解任は理事会の職務ですが、「監事」の選任及び解任は総会の決議によって行います。理事会では監事を選任・解任できません。","答練解説問23（弱点補強）"],
["専有部分の修繕等における理事長の承認については、理事の過半数の承諾があるときは、書面又は電磁的方法による決議によることができる。","○","理事の過半数の承諾があれば、書面又は電磁的方法による決議が可能です。","答練解説問23（弱点補強）"],
["理事長は、理事会の決議を経て、規約に違反した区分所有者に対し、行為の差止め、排除又は原状回復のために、管理組合を代表して、必要な訴訟を提起することができる。","○","理事長は理事会の決議を経て訴訟提起の権限を持ちます。","答練解説問23（弱点補強）"]
]},
{t:"第5章　標準管理規約③",s:"管理費等・修繕積立金・会計規定・団地型／複合用途型",q:[

["マンション管理業者は、管理組合の事業年度終了後一定の期間内に、管理事務の処理状況及び会計の収支の結果を記載した書面を交付し、管理業務主任者をして報告をさせなければならない。","○","年度終了後の報告は管理業務主任者による報告が必要です（10条1項）。","講義④P152"],
["管理組合から請求があったときの管理事務の処理状況及び会計の収支状況の報告についても、管理業務主任者をして報告をさせなければならない。","×","報告義務はありますが、管理業務主任者をして報告させる義務はありません。前問との区別が問われます（10条3項）。","講義④P153"],
["管理組合及びマンション管理業者は、その相手方に対し、少なくとも3か月前に書面で解約の申入れを行うことにより、管理委託契約を終了させることができる。","○","なお、管理業者が登録の取消しの処分を受けたときは、管理組合は催告を要せず契約を解除できます。業務停止命令は解除事由に含まれません（23条1項、20条2項4号）。","講義④P169"],
["マンション管理業者の出納に関する次の記述のうち、標準管理委託契約書の定めによれば、最も適切なものはどれか。マンション管理業者は、管理組合の事業年度終了後一定の時期に、管理組合に対して当年度における管理者事務の処理状況及び会計の収支状況を記載した書面を交付し、管理業務主任者をして報告をさせなければならない。","○","年度終了後の報告は管理業務主任者による報告が必須（10条1項）。","答練基礎答練問10"],
["マンション管理業者は、管理組合からの請求があったときの管理事務の処理状況及び会計の収支状況の報告についても、管理業務主任者をして報告させることが必須である。","×","報告義務はありますが、管理業務主任者が必須ではない（10条3項）との区別が問われます。","答練基礎答練問10"],
["マンション管理業者が管理事務を実施するのに伴い必要となる水道光熱費等の諸費用については、管理組合が負担する。","○","管理事務の実施に伴う費用は管理組合負担です（6条4項）。","答練基礎答練問10"],
["マンション管理業者は、災害または事故等により緊急に行う必要がある業務で、管理組合の承認を受ける時間的余裕がないものについては、理事会の承認を受けて実施することができる。","×","理事会の承認も不要です（9条1項）。","答練基礎答練問10"],
["マンション管理業者が行う管理事務の内容として、浄化槽法に規定する水質検査の業務は、管理事務に含まれていない。","×","水質検査の業務は管理事務に「含まれます」。なお警備業法の警備業務及び消防法の防火管理者が行う業務は管理事務に含まれません。","答練解説問11（弱点補強）"],
["マンション管理業者は、契約締結時に管理事務の再委託先の名称が明らかな場合又は契約締結後に明らかになったときには、管理組合に通知することが望ましい。","○","再委託先の通知は望ましいとされています（努力義務的な規定）。","答練解説問11（弱点補強）"],
["マンション管理業者は、管理組合の承諾を得た場合には、管理事務の処理状況及び管理組合の会計の収支状況に係る報告をWEB会議システム等により行うことができる。","○","WEB会議システム等による報告を行う場合、①WEB会議システム等の種類、②報告の内容、③報告を受けない旨を申し出て中止ができることを、あらかじめ明らかにしておく必要があります。","答練解説問11（弱点補強）"],
["マンション管理業者は、管理組合の管理規約の原本、総会議事録、総会議案書等を、当該マンション管理業者の事務所で保管する。","×","これらの書類は「管理組合」の事務所で保管します。管理業者の事務所ではありません。","答練解説問13（弱点補強）"],
["マンション管理業者は、管理事務を行うため必要なときは、理事会の承認を経て、管理組合の組合員に対して、管理規約に違反する行為の中止を求めることができる。","×","理事会の承認を経ることは要求されていません。管理業者は法令・管理規約・使用細則等に違反する行為の中止を、組合員及びその所有する専有部分の占有者に対して求めることができます。","答練解説問13（弱点補強）"],
["マンション管理業者は、管理事務を受託しているマンションにおける滅失等の事実を知った場合は、速やかにその状況を管理組合に通知しなければならず、この通知は書面又は口頭でもよい。","○","滅失・き損・瑕疵等の事実を知った場合、速やかに相手方に通知しなければならず、書面・口頭いずれの方法でも可能です。","答練解説問13（弱点補強）"],
["マンション管理業者に破産手続開始の申立てがあった場合、管理組合は、破産手続開始の決定があった後に破産管財人の許可を得て、管理委託契約を解除することができる。","×","破産手続開始の「申立てがあったとき」に、管理組合は何らの催告を要せずに管理委託契約を解除することができます。破産手続開始の決定後の破産管財人の許可は不要です。","答練解説問14（弱点補強）"],
["管理組合又はマンション管理業者は、管理委託契約を更新しようとする場合、当該契約の有効期間が満了する日の3か月前までに、その相手方に対し、その旨を書面又は口頭で申し出る必要がある。","×","更新の申出は「書面をもって」行う必要があります。口頭では足りません。","答練解説問14（弱点補強）"],
["管理組合から管理委託契約の更新について申出があった場合において、その有効期間が満了する日までに更新に関する協議が整う見込みがないときは、管理組合及びマンション管理業者は、当該契約と同一の条件で、任意の期間を定めて暫定契約を締結することができる。","○","暫定契約は「期間を定めて」締結することができます（3か月以内という限定はありません）。","答練解説問14（弱点補強）"],
["マンション標準管理者事務委託契約書において、マンション管理業者は、管理組合の管理者として、当該管理組合の管理規約、使用細則その他細則又は理事会の決議により、管理者の職務として定められた業務を遂行する。","○","管理者事務は、管理規約等に基づく業務、及び法令により管理者が行うこととされた業務を遂行するものです。","答練解説問15（弱点補強）"],
["管理組合がマンション管理業者に対し別途管理組合の管理事務を委託する場合、マンション管理業者は、管理者事務を担当する職員（管理者事務担当者）と、管理事務を担当する者（管理事務担当者）は、別の部門に所属する者が務める体制を整備する。","○","利益相反防止のため、管理者事務担当者と管理事務担当者は別部門に所属する者が務める体制が求められます。","答練解説問15（弱点補強）"],
["マンション管理業者は、管理組合の事業年度終了後一定の時期に、管理組合の組合員に対し、当該年度における管理者事務の処理状況を記載した書面を交付するだけでなく、理事会において報告をしなければならない。","×","報告は「総会」において行わなければなりません。理事会ではありません。","答練解説問15（弱点補強）"],
["管理組合は、マンション管理業者が当該管理組合の管理規約に定める管理者の欠格事由に該当するに至ったときは、直ちに当該管理者事務委託契約を解除することができる。","×","管理者の欠格事由該当時や27条各号の確認事由（反社会的勢力の排除）に反する事実が判明したときは、「総会での解任議案の承認を経て」管理者事務委託契約を解除することができます。直ちにではありません。","答練解説問15（弱点補強）"]
]},
{t:"第8章　民法（総則）",s:"契約・制限行為能力者・意思表示・代理・無権代理（マン管で毎年出題される基本分野）",q:[
["契約は、申込みに対して相手方が承諾をしたときに成立し、原則として、契約書を作成することを要しない。","○","契約は申込みに対して相手方が承諾をしたときに成立し（民法522条1項）、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しません（同2項）。","民法・契約 問1"],
["賃貸借契約や請負契約は双務・諾成契約であるのに対し、贈与契約や使用貸借契約は片務・要物契約である。","×","賃貸借契約・請負契約は双務・諾成契約ですが、贈与契約・使用貸借契約は片務・「諾成」契約です。要物契約ではありません。","民法・契約 問2"],
["成年被後見人が成年後見人の同意を得て行ったマンションの売買契約は、取り消すことができる。","○","成年後見人には同意権がないので、その同意を得て行った契約であっても、取り消すことができます（9条）。","民法・制限行為能力者 問3"],
["成年被後見人Aの成年後見人であるBが、Aを代理してAが所有するマンションの一住戸の区分所有権を売却するためには、家庭裁判所の許可を得なければならない。","○","成年後見人は、成年被後見人の居住用の建物又はその敷地について、売却等の処分をするには、家庭裁判所の許可を得なければなりません（859条の3）。","民法・制限行為能力者 問4"],
["被保佐人については、マンションの一住戸の区分所有権等を売却する場合だけではなく、日用品を購入する場合も、保佐人の同意が必要である。","×","不動産の売却は重要な財産上の行為に該当するため保佐人の同意が必要ですが（13条1項）、日用品の購入には保佐人の同意は不要です（13条1項ただし書、9条ただし書）。","民法・制限行為能力者 問5"],
["被保佐人がマンションの一住戸の区分所有権等を売買するにおいて、保佐人が被保佐人の利益を害するおそれがないにもかかわらず同意をしないときは、家庭裁判所は、被保佐人の請求により、保佐人の同意に代わる許可を与えることができる。","○","保佐人が理由なく同意しない場合、家庭裁判所は被保佐人の請求により同意に代わる許可を与えることができます（13条3項）。","民法・制限行為能力者 問6"],
["被保佐人が保佐人の同意を得ずに単独で自己の所有するマンションを売却した場合、その相手方は、保佐人に対し、当該行為を追認するか否かを確答すべき旨を催告することができ、一定期間内に保佐人が確答しないときは、追認は拒絶されたものとみなされる。","×","制限行為能力者の相手方は、法定代理人・保佐人・補助人に対し、1ヵ月以上の期間を定めて追認するか否かの催告をすることができ、確答がないときは「追認したもの」とみなされます（20条2項）。拒絶されたものとみなす、ではありません。","民法・制限行為能力者 問7"],
["Aが、Bに対して、本心では売るつもりがないのに自己所有のマンションを売却する旨の意思表示をした場合、Aの意思表示が真意でないことをBが過失により知らなかったときは、AB間の売買契約は無効となる。","○","心裡留保による意思表示は原則有効ですが、真意でないことを相手方が知っていた（悪意）場合、又は注意すれば知ることができた場合（有過失）は無効となります（93条1項）。","民法・意思表示 問8"],
["Aの所有するマンションに係るAB間の売買契約が通謀虚偽表示である場合、Bがそのマンションを善意のCに売却したとしても、Cに過失があるときは、Aは、AB間の売買契約の無効をCに対抗することができる。","×","通謀虚偽表示は無効ですが（94条1項）、この無効は「善意」の第三者に対抗できません（同2項）。過失（善意有過失）があっても、善意であれば対抗できない点に注意です。","民法・意思表示 問9"],
["AがBの詐欺によってB所有のマンションを購入する意思表示をした場合、Bの詐欺によって意思表示をしたことについてAに過失があるときは、Aは、詐欺を理由として自己の意思表示を取り消すことができない。","×","詐欺によって意思表示をしたことについて表意者に過失があったときでも、表意者は当該意思表示を取り消すことができます（96条1項）。","民法・意思表示 問10"],
["Aが、Bの強迫を理由としてAが所有するマンションの一住戸をBに売却した旨の意思表示を取り消した場合に、Aの取消し前に、Bが、その事情を知らず、かつその事情を知らないことについて過失のない第三者Cに転売していたときは、Aは、Cに対して取消しの効果を主張することができない。","×","強迫による意思表示の取消しについては、取消し前に現れた善意無過失の第三者にも主張することができます（96条3項の反対解釈）。詐欺の場合と異なり強迫は保護が厚い点がポイントです。","民法・意思表示 問11"],
["Aは、B所有のマンションを購入したが、Aの購入の意思表示は法律行為の基礎とした事情についてのその認識が真実に反する錯誤によってなされていた。この場合、その事情が法律行為の基礎とされていることが表示されていなければ、Aは、Bに対し、契約の取消しを主張できない。","○","動機の錯誤による意思表示の取消しは、その事情が法律行為の基礎とされていることが「表示されていたときに限り」できます（95条2項・1項2号）。","民法・意思表示 問12"],
["代理人が本人のためにすることを示さないで代理行為をした場合、相手方が本人のためにすることを知っていたときに限り、当該行為の効果は、本人と相手方との間に直接生じる。","×","代理人が本人のためにすることを示さないでした意思表示は、相手方が「知り、又は知ることができたとき」は、本人に直接効力を生じます（100条、99条1項）。「知っていたときに限り」ではありません。","民法・代理 問13"],
["Aが、自己の所有するマンションの一住戸をBに売却する契約の締結について、Cに代理権を授与した場合において、Cが制限行為能力者であった場合に、Aは、Cの制限行為能力を理由に代理行為を取り消すことができない。","○","制限行為能力者が任意代理人としてした行為は、行為能力の制限によっては取り消すことができません（102条）。","民法・代理 問14"],
["任意代理の場合、本人に補助開始の審判があると、代理権は消滅する。","×","任意代理権の消滅原因は、本人については「死亡」「破産手続開始の決定」のみです（111条、653条）。補助開始の審判は含まれません。","民法・代理 問15"],
["AがA所有のマンションの売買に関する代理権をBに与えた場合、Bは、Aの許諾がなくても、売主A及び買主C双方の代理人として有効に売買契約を締結できる。","×","同一の法律行為について当事者双方の代理人としてした行為（双方代理）は、代理権を有しない者がした行為とみなされます。ただし、本人があらかじめ許諾した行為は有効にできます（108条1項）。","民法・代理 問16"],
["法定代理人は、やむを得ない事由があるときでなければ復代理人を選任することができず、その選任・監督について過失がない場合にも、常に本人に対して責任を負う。","×","法定代理人は、自己の責任で、いつでも自由に復代理人を選任することができ、原則として全責任を負いますが、やむを得ない事由があるときは、その選任・監督についてのみ責任を負います（105条）。任意代理人との違いに注意です。","民法・代理 問17"],
["代理権を有しない者が他人の代理人として契約した場合において、相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができるが、本人がその期間内に確答をしないときは、追認したものとみなされる。","×","本人がその期間内に確答をしないときは、追認を「拒絶」したものとみなされます（114条）。制限行為能力者の相手方の催告（20条2項）とは結論が逆になる点に注意です。","民法・無権代理 問18"],
["Aが、Bから代理権を与えられていないにもかかわらず、Bの代理人として、Cとの間で、Bの所有するマンションの一住戸をCに売却する旨の売買契約を締結した場合、Cは、Aの無権代理について善意無過失であれば、Bが売買契約を追認しても、当該契約を取り消すことができる。","×","代理権を有しない者がした契約は、本人が追認しない間は相手方が取り消すことができますが（115条）、本人Bが追認した後は契約が有効に確定するため、Cはもはや取り消すことができません。","民法・無権代理 問19"],
["本人Aが代理人Bに与えた代理権が消滅した後にBが行った代理権の範囲内の行為について、相手方Cが過失によって代理権消滅の事実を知らなかった場合でも、Aはその責任を負わなければならない。","×","代理権消滅後にその範囲内で他人が第三者との間でした行為について、本人は代理権消滅の事実を知らなかった第三者に責任を負いますが、第三者が過失によってその事実を知らなかったときは責任を負いません（112条1項）。本問のCは過失があるため、Aは責任を負いません。","民法・無権代理 問20"]
]},
{t:"第9章　宅建業法・その他関連法",s:"重要事項の説明／37条書面／8種規制／消費者契約法・個人情報保護法・アフターサービス（権利取得者は宅建業者でない者とする）",q:[
["宅地建物取引士は、重要事項の説明をするときは、宅地建物取引士証を提示しなければならないが、宅地建物取引士証に代えて従業者証明書を提示することができる。","×","宅建士証の提示は取引の相手方から請求がなくても必要です（宅建業法35条4項）。従業者証明書による代替提示は認められていません。","宅建業法・重説 問1"],
["宅地建物取引士は、貸借の媒介の依頼者に対してのみ、テレビ会議等のITを用いて重要事項の説明をすることができる。","×","IT重説は売買・交換・貸借の「全ての取引」について実施可能です。貸借に限られません（宅建業法の解釈・運用の考え方35条1項関係2）。","宅建業法・重説 問2"],
["重要事項の説明は、当該説明の相手方の自宅において、実施することができる。","○","宅建業法は重要事項の説明場所について特に規定していません。宅建業者の事務所等以外の場所で説明を行ってもよいとされています。","宅建業法・重説 問3"],
["宅地建物取引業者は、自ら売主として建物の売買をする場合、別の宅地建物取引業者が買主であるときは、重要事項の説明を行う必要はあるが、重要事項説明書の交付は不要である。","×","逆です。買主も宅建業者である場合、重要事項の「説明」は省略できますが、重要事項説明書の「交付」は必要です（35条6項）。","宅建業法・重説 問4"],
["宅地建物取引業者は、昭和60年10月1日に新築の工事に着手し、完成した建物の売買の媒介を行う場合、当該建物が指定確認検査機関による耐震診断を受けたものであっても、その内容を説明する必要はない。","○","耐震診断の内容は重要事項ですが、昭和56年6月1日以降に新築工事に着手したものは除かれます（施行規則16条の4の3第5号）。本問は昭和60年着手なので説明不要です。","宅建業法・重説 問5"],
["宅地建物取引業者は、建物の貸借の媒介を行う場合、借賃以外に授受される金銭の額については説明しなければならないが、当該金銭の授受の目的については説明する必要はない。","×","借賃以外に授受される金銭の「額」及び当該金銭の「授受の目的」の両方を説明しなければなりません（35条1項7号）。","宅建業法・重説 問6"],
["宅地建物取引業者は、自ら売主としてマンションの一住戸の売買をする場合、当該マンションの所有者が負担しなければならない通常の管理費用の額については、売買に関する内容ではないので説明する必要はない。","×","区分所有者が負担する通常の管理費用の額は、重要事項として説明しなければなりません（35条1項6号、施行規則16条の2第7号）。","宅建業法・重説 問7"],
["宅地建物取引業者は、自ら売主としてマンションの一住戸の売買をする場合には、台所、浴室、便所その他の当該マンションの設備の整備の状況について、説明をしなければならない。","×","台所・浴室・便所その他の設備の整備の状況は、建物の「貸借」の場合における重要事項です（35条1項14号ロ、施行規則16条の4の3第7号）。売買では説明不要です。","宅建業法・重説 問8"],
["宅地建物取引業者は、自ら売主としてマンションの一住戸の売買をする場合には、当該建物の引渡時期を説明する必要がある。","×","建物の引渡時期は37条書面（契約締結時に交付すべき書面）の記載事項であり（37条1項4号）、重要事項の説明の対象ではありません。","宅建業法・重説 問9"],
["宅地建物取引業者は、マンションの一住戸の売買の媒介をする場合、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を説明しなければならない。","×","天災その他不可抗力による損害の負担に関する定めは37条書面の記載事項であり（37条1項10号）、重要事項の説明の対象ではありません。","宅建業法・重説 問10"],
["宅地建物取引業者は、宅地建物取引士をして、37条書面の記名及び交付を行わせなければならない。","×","37条書面への「記名」は宅建士が行わなければなりませんが、当該書面の「交付」については宅建士が行う必要はありません（37条1項・3項）。","宅建業法・37条書面 問11"],
["宅地建物取引業者は、自ら売主としてマンションの売買契約を締結した場合、別の宅地建物取引業者が買主であるときは、37条書面の交付を省略することができる。","×","宅建業者相互間の取引においても、37条書面の交付は必要です（37条1項）。重要事項の説明が省略できる点との違いに注意です。","宅建業法・37条書面 問12"],
["宅地建物取引業者でない買主Bが、宅地建物取引業者Aから書面によりクーリング・オフできる旨及びその方法を告げられてから8日を経過したときは、Bはクーリング・オフをすることができない。","○","クーリング・オフは①申込者等が物件の引渡しを受け、かつ代金の全額を支払ったとき、又は②書面でクーリング・オフできる旨及びその方法を告げられてから8日を経過したときは、できなくなります（37条の2第1項）。","宅建業法・8種規制 問13"],
["宅地建物取引業者Aが自ら売主として、宅地建物取引業者でない買主Bと中古マンションの一住戸の売買契約を締結した場合、BがAに対し品質に関する契約不適合があった旨を通知すべき期間を引渡しの日から5年間とする旨の特約は有効である。","○","宅建業者が自ら売主となる売買契約では、契約不適合を通知すべき期間について、特約で引渡しの日から「2年以上」と定めることができ、これに反する特約は無効です（40条1項・2項）。本問は5年間なので有効です。","宅建業法・8種規制 問14"],
["内閣総理大臣の認定を受けた適格消費者団体は、消費者に代わって、事業者等に対し、損害賠償請求をすることができる。","×","適格消費者団体は事業者等に対して「差止請求」をすることができますが（消費者契約法1条、12条）、損害賠償請求をすることはできません。","消費者契約法 問15"],
["宅地建物取引業者でない株式会社が、マンションの一住戸を業務用として使用する目的の個人に売却する契約には、消費者契約法が適用される。","×","消費者とは、事業として又は事業のために契約の当事者となる場合における者を除いた個人をいいます（2条1項）。個人であっても業務用として使用する目的であれば消費者に該当せず、消費者契約法は適用されません。","消費者契約法 問16"],
["死者に関する情報が、同時に、遺族等の生存する個人に関する情報でもある場合には、当該生存する個人に関する情報に該当するので、「個人情報」に該当する。","○","個人情報とは「生存する個人」に関する情報ですが（2条1項）、死者に関する情報が同時に遺族等の生存する個人に関する情報でもある場合には、個人情報に該当します（個人情報保護法ガイドライン2-1）。","個人情報保護法 問17"],
["管理組合の組合員の氏名が記載されている組合員名簿が、電子計算機を用いて検索することができるように体系的に構成したものではなく、紙面で作成されている場合、五十音順など一定の規則に従って整理することにより、容易に検索できるようなときであっても、その組合員名簿は「個人情報データベース等」に該当しない。","×","個人情報データベース等には、①電子計算機で検索できるように体系的に構成したものだけでなく、②特定の個人情報を容易に検索できるように体系的に構成したものとして政令で定めるものも含まれます。紙面で作成されていても該当します（16条1項、施行令4条2項）。","個人情報保護法 問18"],
["アフターサービスの対象となる建物の部位は、基本構造部分（住宅の構造耐力上主要な部分及び雨水の浸入を防止する部分で政令で定めるもの）に限定されている。","×","アフターサービスは、契約で定めた一定期間・一定の部位について売主が無償で補修するサービスであり、対象部位は「当事者間の契約の定め」によって決まります。基本構造部分に限定されているとはいえません。","アフターサービス 問19"],
["天災地変等の不可抗力による損壊及び購入者の使用ミスによる損壊についても、アフターサービスの対象とされていることが多い。","×","天災地変（地震、火災、風・水・雪害）等の不可抗力による場合や、管理不十分・使用上の不注意による場合は「適用除外」とされています（中高層住宅アフターサービス規準）。","アフターサービス 問20"]
]},
{t:"第10章　標準管理委託契約書（総合演習）",s:"管理事務の範囲／再委託／費用負担／報告義務／解除（一問一答の総合演習セット）",q:[
["警備業法に定める警備業務及び消防法に定める防火管理者が行う業務は、管理事務に含まれる。","×","警備業法に定める警備業務および消防法に定める防火管理者が行う業務は、管理事務に「含まれません」（全般関係コメント③）。","委託契約書・総合 問1"],
["オートロック設備、宅配ボックスは、専有部分に属さない建物の部分に含まれる。","×","オートロック設備・宅配ボックスは、専有部分に属さない建物の「附属物」に含まれます（2条5号ハ）。「建物の部分」ではありません。","委託契約書・総合 問2"],
["専用使用部分（バルコニー、トランクルーム、専用庭等）は、管理対象部分には含まれない。","×","専用使用部分については、管理組合が行うべき管理業務の範囲内においてマンション管理業者が管理事務を行います（2条関係コメント②）。一切含まれないわけではありません。","委託契約書・総合 問3"],
["マンション管理業者は、年に一度、管理組合の組合員の管理費等の滞納状況を、当該管理組合に報告する。","×","滞納状況の報告は「毎月」行います（別表第1の1(2)②一）。年に一度ではありません。","委託契約書・総合 問4"],
["マンション管理業者は、管理組合の組合員が管理費を滞納したときは、当該組合員に対して電話等により支払の督促を行うが、なお当該組合員が滞納管理費を支払わないときは、その支払を求める訴訟を提起しなければならない。","×","電話・自宅訪問・督促状の方法により督促を行いますが、なお支払われないときは、その責めを免れ、その後の収納の請求は管理組合が行います（11条1項、別表第1の1(2)②）。訴訟提起の義務はありません。","委託契約書・総合 問5"],
["マンション管理業者は、長期修繕計画案の作成業務並びに建物・設備の劣化状況等を把握するための調査・診断の実施及びその結果に基づき行う当該計画の見直し業務を実施する場合には、管理委託契約とは別個の契約とする。","○","これらの業務は管理委託契約に含まれず、別個の契約とします（別表第1の1(3)一）。","委託契約書・総合 問6"],
["管理組合がマンションの維持又は修繕（大規模修繕を除く修繕又は保守点検等）を外注によりマンション管理業者以外の業者に行わせる場合におけるマンション管理業者が行う「見積書の受理」の業務には、見積書の提出を依頼する業者への現場説明は含まれない。","○","「見積書の受理」には、業者への現場説明や見積書の内容に対する管理組合への助言等（内容や依頼内容との整合性の確認の範囲を超えるもの）は含まれません（別表第1の1(3)関係コメント⑤）。","委託契約書・総合 問7"],
["管理員業務のうち立会業務には、災害・事故等の処理の立会い、そのための専有部分の鍵の保管が含まれる。","×","立会業務には災害・事故等の処理の立会いは含まれますが（別表第2の2(3)三）、専有部分の鍵の保管は含まれません。","委託契約書・総合 問8"],
["マンション管理業者は、事務管理業務、管理員業務、清掃業務、建物・設備管理業務の管理事務の全部を第三者に再委託することができる。","×","事務管理業務は「一部」しか再委託できません。管理員業務・清掃業務・建物設備管理業務は全部又は一部の再委託が可能です（4条1項）。","委託契約書・総合 問9"],
["マンション管理業者が管理事務を実施するのに伴い必要となる水道光熱費等の諸費用の負担については、管理組合が負担する。","○","管理事務の実施に伴い必要となる諸費用は管理組合が負担します（6条4項）。","委託契約書・総合 問10"],
["マンション管理業者が管理事務室を使用する際に必要となる水道光熱費は、管理組合が負担しなければならない。","×","管理事務室等の使用に係る諸費用（水道光熱費、通信費、備品、消耗品費等）の負担は、「管理組合又はマンション管理業者」の負担とされており、いずれの負担にもできます（7条2項、7条関係コメント②）。前問（管理事務の実施に伴う費用＝管理組合負担）との区別が重要です。","委託契約書・総合 問11"],
["管理組合の管理業者に対する管理事務に関する指示については、法令の定めに基づく場合を除き、管理組合の管理者等または管理組合の指定する管理組合の役員が管理業者の使用人その他の従業者のうち管理業者が指定した者に対して行う。","○","指示の経路が定められています（8条）。誰から誰への指示かという流れを押さえます。","委託契約書・総合 問12"],
["マンション管理業者は、受託した管理事務の内容にかかわらず、災害又は事故等の事由により、管理組合のために、緊急に行う必要のある業務で、管理組合の承認を受ける時間的な余裕がないものについては、理事会の承認を受けて実施する。","×","管理組合の承認を「受けないで」実施することができます（9条1項柱書前段）。理事会の承認を受ける必要もありません。","委託契約書・総合 問13"],
["マンション管理業者は、管理組合の事業年度終了後一定の期間内に、管理組合に対し、当該年度における管理事務の処理状況及び管理組合の会計の収支の結果を記載した書面を交付し、管理業務主任者をして、報告をさせなければならない。","○","年度終了後の報告は、書面の交付＋管理業務主任者による報告が必要です（10条1項）。","委託契約書・総合 問14"],
["マンション管理業者は、管理組合から請求があるときは、管理事務の処理状況及び管理組合の会計の収支状況について、管理業務主任者をして、報告をさせなければならない。","×","請求があるときは報告を行わなければなりませんが（10条3項）、管理業務主任者をして報告をさせる義務はありません。前問（年度終了後の報告）との違いが最重要ポイントです。","委託契約書・総合 問15"],
["マンション管理業者は、管理組合の組合員に対し、カスタマーハラスメントに該当する行為の中止を求めることはできない。","×","管理事務を行うため必要なときは、管理組合の組合員に対し、管理組合に代わって、カスタマーハラスメントに該当する行為の中止を求めることが「できます」（12条1項4号）。","委託契約書・総合 問16"],
["管理組合又はマンション管理業者は、本マンションにおいて滅失・き損・契約不適合等の事実を知った場合、速やかに、書面をもって、その状況を相手方に通知しなければならない。","×","速やかに相手方に通知しなければなりませんが（13条1項）、書面をもって通知すべきものとはされていません。口頭でも足ります。","委託契約書・総合 問17"],
["マンション管理業者は、地震の影響により管理組合のために緊急に行う必要がある業務を、組合員の専有部分に立ち入って実施した場合には、管理組合及び当該専有部分の組合員に対し、事後速やかに、報告をしなければならない。","○","緊急時には専有部分等に立ち入ることができ、この場合、管理組合及び立ち入った専有部分等に係る組合員等に対し、事後速やかに報告をしなければなりません（14条3項）。","委託契約書・総合 問18"],
["マンション管理業者が、マンション管理適正化法の規定に基づく業務停止命令の処分を受けたときは、管理組合は、何らの催告を要せずして、管理委託契約を解除することができる。","×","催告を要せず解除できるのは「登録の取消し」の処分を受けたときです（20条2項4号）。この解除の対象に業務停止命令の処分は含まれていません。","委託契約書・総合 問19"],
["管理組合及びマンション管理業者は、その相手方に対し、少なくとも3か月前に書面で解約申入れを行うことにより、管理委託契約を終了させることができる。","○","少なくとも3ヵ月前の書面による解約の申入れにより、契約を終了させることができます（23条1項）。","委託契約書・総合 問20"]
]},
{t:"第11章　標準管理規約（単棟型）総合演習",s:"専有部分・共用部分の範囲／敷地等の共有／用法／管理（一問一答の総合演習セット）",q:[
["各住戸の玄関扉の錠及び内部塗装部分並びに雨戸又は網戸は、いずれも専有部分である。","×","玄関扉は錠・内部塗装部分が専有部分です（7条2項2号）。しかし、窓枠・窓ガラス・雨戸・網戸は専有部分に含まれず、共用部分です（7条関係コメント③④、同2項3号）。","規約単棟・総合 問1"],
["メーターボックス（給湯器ボイラー等の設備を含む）は、共用部分である。","×","メーターボックスは共用部分ですが、その内部にある給湯器ボイラー等の設備は専有部分です（別表第2の1）。","規約単棟・総合 問2"],
["配線配管（給水管については、本管から各住戸メーターを含む部分、雑排水管及び汚水管については、配管継手及び立て管）は、共用部分である。","○","給水管は本管から各住戸メーターを含む部分、雑排水管・汚水管は配管継手及び立て管が共用部分です（8条、別表第2の2）。","規約単棟・総合 問3"],
["共用部分の共有持分の割合の基準となる面積は、壁心計算（界壁の中心線で囲まれた部分の面積を算出する方法をいう）による。","○","共用部分の共有持分の割合の基準となる面積は壁心計算によります（10条関係コメント①）。内法計算ではありません。","規約単棟・総合 問4"],
["敷地及び附属施設の共有持分は、規約によって定まるが、共用部分の共有持分は、分譲契約等によって定まる。","×","逆です。敷地及び附属施設の共有持分は「分譲契約等」によって定まり、共用部分の共有持分は「規約」で定まります（10条関係コメント②③）。","規約単棟・総合 問5"],
["駐車場使用細則、駐車場使用契約等に、管理費、修繕積立金の滞納等の規約違反の場合は、契約を解除できるか又は次回の選定時の参加資格をはく奪することができる旨の規定を定めることはできない。","×","そのような規定を定めることも「できます」（15条関係コメント⑦）。","規約単棟・総合 問6"],
["駐車場使用契約をしている区分所有者が、その専有部分を第三者へ譲渡した場合、譲り受けた区分所有者が駐車場の使用を希望するときは、管理組合と新たな駐車場使用契約を締結しなければならない。","○","区分所有者が専有部分を他の区分所有者又は第三者に譲渡又は貸与したときは、その区分所有者の駐車場使用契約は効力を失います（15条3項）。譲り受けた者は新たな契約を締結する必要があります。","規約単棟・総合 問7"],
["管理組合は、理事会の決議を経て、敷地及び共用部分等（駐車場及び専用使用部分を除く）の一部について、第三者に使用させることができる。","×","「総会」の決議を経る必要があります（16条2項）。理事会の決議では足りません。","規約単棟・総合 問8"],
["区分所有者は、その専有部分を修繕する場合、その修繕が共用部分又は他の専有部分に影響を与えるおそれのあるものであるときには、あらかじめ、理事長にその旨を申請し、書面又は口頭による承認を受けなければならない。","×","あらかじめ理事長にその旨を申請し、「書面による承認」を受けなければなりません（17条1項）。口頭での承認はできません。","規約単棟・総合 問9"],
["専有部分の修繕について理事長の承認を受けた場合、当該修繕工事により共用部分に生じた事後的な影響については、当該修繕工事を行った区分所有者は、その責任や負担を免れる。","×","理事長の承認を受けた工事後に、当該工事により共用部分又は他の専有部分に影響が生じた場合は、当該工事を発注した区分所有者の責任と負担により必要な措置をとらなければなりません（17条6項）。承認を受けても責任は免れません。","規約単棟・総合 問10"],
["区分所有者は、賃借人による対象物件の使用、収益に際し、当該賃借人が規約及び使用細則に定める事項を遵守する旨の条項を定めた賃貸借契約書の写しを管理組合に提出しなければならない。","×","貸与に係る契約に遵守義務の条項を定め、賃借人に遵守する旨の「誓約書」を管理組合に提出させなければなりません（19条2項）。賃貸借契約書の写しの提出は要求されていません。","規約単棟・総合 問11"],
["専有部分である設備のうち共用部分と構造上一体となった部分の保存行為を共用部分の管理と一体として行う必要があるときは、理事会の決議を経て、管理組合がこれを行うことができる。","×","「総会」の決議を経て、管理組合がこれを行うことができます（21条2項）。理事会の決議では足りません。","規約単棟・総合 問12"],
["専有部分である住戸に付属する窓ガラスを当該住戸の賃借人が割った場合には、管理組合がその責任と負担において修繕を行う。","×","バルコニー等の保存行為のうち通常の使用に伴うものは、専用使用権を有する者（住戸の区分所有者）がその責任と負担において行わなければなりません（21条1項ただし書）。賃借人等による破損も通常の使用に伴うものとして、専用使用権を有する者が負担します（同関係コメント④・⑥ただし書）。","規約単棟・総合 問13"],
["専有部分である住戸に付属する窓ガラスを、より断熱性等に優れた複層ガラスに交換する工事は、原則として、当該住戸の区分所有者がその責任と負担において行う。","×","窓枠・窓ガラス・玄関扉その他の開口部に係る改良工事であって、防犯・防音・断熱等の住宅の性能向上等に資するものは、「管理組合」がその責任と負担において計画修繕として実施します（22条1項）。管理組合が速やかに実施できない場合に、区分所有者が理事長の書面による承認を受けて自ら実施できます（同2項）。","規約単棟・総合 問14"],
["理事長は、災害、事故等が発生した場合であって、緊急に立ち入らないと共用部分等又は他の専有部分に対して物理的に又は機能上重大な影響を与えるおそれがあるときは、専有部分又は専用使用部分に自ら立ち入ることができる。","○","理事長は自ら立ち入り、又は委任した者に立ち入らせることができます（23条4項）。","規約単棟・総合 問15"],
["理事長は、管理組合が締結した共用部分等に関する損害保険契約に基づく保険金の請求及び受領について、区分所有者を代理する。","○","理事長は、保険金並びに敷地及び共用部分等について生じた損害賠償金及び不当利得による返還金（保険金等）の請求及び受領について、区分所有者及び区分所有者であった者（旧区分所有者）を代理します（24条2項）。","規約単棟・総合 問16"],
["専門的知識を有する者の活用に要する費用は、修繕積立金を取り崩して充当する。","×","専門的知識を有する者の活用に要する費用は「管理費」を充当します（27条9号）。","規約単棟・総合 問17"],
["マンション再生等に係る合意形成に必要となる事項の調査費用については、管理費を充当する。","×","建替え・建物の更新・建物敷地売却・建物取壊し敷地売却又は取壊し（マンション再生等）に係る合意形成に必要となる事項の調査費用は、「修繕積立金」を取り崩して充当することができます（28条1項4号）。前問（専門的知識を有する者の活用＝管理費）との区別が最重要です。","規約単棟・総合 問18"],
["管理組合は、特別の管理に要する経費に充てるため借入れをしたときは、管理費をもって償還にあてることができる。","×","借入金の償還は「修繕積立金」をもって充てることができます（28条4項）。管理費ではありません。","規約単棟・総合 問19"],
["管理組合は、管理費が不足した場合、駐車場使用料の値上げをして、駐車場の管理に要する費用に充てるほか、その余剰分を管理費に充当することができる。","×","駐車場使用料その他の使用料は、それらの管理に要する費用に充てるほか、「修繕積立金」として積み立てます（29条）。管理費が不足した場合に値上げをして、その余剰分を管理費に充当することはできません。","規約単棟・総合 問20"]
]},
];

function init(){
 const s=document.getElementById('sel'),b=document.getElementById('body');
 D.forEach((c,i)=>{
  const bt=document.createElement('button');
  bt.className='cb'+(i===0?' on':'');
  bt.textContent='第'+(i+1)+'章';
  bt.onclick=()=>go(i);
  s.appendChild(bt);

  const d=document.createElement('div');
  d.className='ch'+(i===0?' on':'');
  let h='<div class="ct">'+c.t+'</div><div class="cs">'+c.s+'</div>';
  if(i===0)h+='<div class="warn">この問題集は講義録①〜⑥、正誤表（2026年7月2日現在）および2026年度TAC合格目標【マン管・管業】基礎答練（規約・会計）で根拠を確認して作成しています。解説の条文番号・参照ページも必ずテキストで確認してください。</div>';
  d.innerHTML=h;

  c.q.forEach((q,j)=>{
   const mark=q[1],cls=(mark==='○')?'o':'x';
   const card=document.createElement('div');
   card.className='card';
   card.innerHTML='<div class="num">問'+(j+1)+'</div><div class="qt">'+q[0]+'</div>'+
    '<button class="ab" onclick="sh(this)">答えを表示</button>'+
    '<div class="box '+cls+'"><div class="mk">'+mark+'</div><div class="ex">'+q[2]+'</div><div class="ref">▸ '+q[3]+'</div></div>';
   d.appendChild(card);
  });
  b.appendChild(d);
 });
}
function sh(b){const x=b.nextElementSibling;x.classList.toggle('on');b.textContent=x.classList.contains('on')?'答えを隠す':'答えを表示';}
function go(i){
 document.querySelectorAll('.ch').forEach(e=>e.classList.remove('on'));
 document.querySelectorAll('.cb').forEach(e=>e.classList.remove('on'));
 document.querySelectorAll('.ch')[i].classList.add('on');
 document.querySelectorAll('.cb')[i].classList.add('on');
 window.scrollTo(0,0);
}
function tg(){
 const bx=document.querySelectorAll('.box'),bs=document.querySelectorAll('.ab');
 const show=Array.from(bx).some(e=>!e.classList.contains('on'));
 bx.forEach(e=>e.classList.toggle('on',show));
 bs.forEach(e=>e.textContent=show?'答えを隠す':'答えを表示');
}
init();
</script>
</body>
</html>
